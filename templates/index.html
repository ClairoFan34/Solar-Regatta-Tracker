<!DOCTYPE html>
<html>
<head>
    <title>Solar Regatta Tracker</title>
</head>
<body>
    <h1>Solar Regatta Team Tracker</h1>
    <p>Current Task: </p>
        {% for subteam in subteams %}
    <h3>{{ subteam }}</h3>
    <ul>
        {% for task in tasks %}
            {% if task.subteam == subteam %}
                <li>{{ task.title }} — {{ task.owner }} — due {{ task.due }}</li>
            {% endif %}
        {% endfor %}
    </ul>
{% endfor %}
</body>
</html>
